[project]
name = "taviq"
version = "0.2.0"
language_edition = "0.2"
entry = "examples/hello.taviq"

[build]
backend = "qvm"

[ai]
hub = "huggingface"
default_inference_provider = "llama.cpp"
default_endpoint = "http://127.0.0.1:8080"

[security]
require_pinned_model_revision = true
require_package_sha256 = true
