name: TAVIQ CI
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-build:
    name: Build and test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: taviq-cli-${{ runner.os }}
          path: |
            build/taviq
            build/Release/taviq.exe
          if-no-files-found: ignore

  opencl-provider:
    name: Build and execute optional OpenCL provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenCL development files and CPU ICD
        run: |
          sudo apt-get update
          sudo apt-get install --yes ocl-icd-opencl-dev pocl-opencl-icd
      - name: Configure with OpenCL provider enabled
        run: cmake -S . -B build-opencl -DCMAKE_BUILD_TYPE=Release -DTAVIQ_ENABLE_OPENCL_PROVIDER=ON
      - name: Build
        run: cmake --build build-opencl --config Release --parallel
      - name: Run OpenCL provider integration test
        run: ctest --test-dir build-opencl -C Release -R "taviq_opencl_provider_tests|taviq_gpu_cli_integration" --output-on-failure

  android-arm64:
    name: Android NDK cross-build (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.31.6"
      - name: Configure Android
        run: >
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DCMAKE_BUILD_TYPE=Release
      - name: Build Android CLI
        run: cmake --build build-android --config Release --parallel
      - uses: actions/upload-artifact@v7
        with:
          name: taviq-cli-android-arm64
          path: build-android/taviq
          if-no-files-found: error

  android-app:
    name: Build TAVIQ Android application (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK and NDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"
      - name: Build Android APK with JNI runtime
        run: gradle -p platforms/android --no-daemon :app:assembleDebug
      - name: Start Android Debug Bridge before emulator launch
        run: |
          adb kill-server || true
          adb start-server
          adb version
      - name: Run TAVIQ instrumentation tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          disable-animations: true
          script: gradle -p platforms/android --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        with:
          name: taviq-android-debug-arm64
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
