name: TAVIQ CI
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-build:
    name: Build and test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: taviq-cli-${{ runner.os }}
          path: |
            build/taviq
            build/Release/taviq.exe
          if-no-files-found: ignore

  android-arm64:
    name: Android NDK cross-build (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.31.6"
      - name: Configure Android
        run: >
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DCMAKE_BUILD_TYPE=Release
      - name: Build Android CLI
        run: cmake --build build-android --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: taviq-cli-android-arm64
          path: build-android/taviq
          if-no-files-found: error
