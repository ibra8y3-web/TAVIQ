name: Security baseline
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Python tools
        run: python -m compileall -q ai tools studio tests/python
      - name: Python security lint
        run: |
          python -m pip install --disable-pip-version-check bandit
          bandit -q -lll -r ai tools studio -x tests
      - name: Verify dependency policy
        run: python tools/check_dependencies.py

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp, python
      - name: Configure CodeQL build
        run: cmake -S . -B build-codeql -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build CodeQL targets
        run: cmake --build build-codeql --parallel 2
      - uses: github/codeql-action/analyze@v3
